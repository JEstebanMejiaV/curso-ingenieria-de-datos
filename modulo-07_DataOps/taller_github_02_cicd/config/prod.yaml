# Configuración para ambiente de producción

environment: production

debug: false

database:
  host: prod-db.example.com
  port: 5432
  name: ecommerce_prod
  url: postgresql://user:pass@prod-db.example.com:5432/ecommerce_prod

api:
  key: prod-api-key-XXXXX
  base_url: https://api.example.com
  timeout: 60

logging:
  level: WARNING
  format: json
  output: cloudwatch

features:
  enable_cache: true
  enable_analytics: true
  enable_notifications: true

limits:
  max_items_per_order: 100
  max_order_value: 10000000

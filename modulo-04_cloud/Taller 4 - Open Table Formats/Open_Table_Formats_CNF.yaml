AWSTemplateFormatVersion: "2010-09-09"

Metadata:
    Generator: "keezhada"
Description: "CloudFormation template for OTF in a box workshop"

Mappings:
  SubnetConfig:
    VPC:
      CIDR: 10.0.0.0/16
    Public1:
      CIDR: 10.0.1.0/24
    Public2:
      CIDR: 10.0.2.0/24
    Public3:
      CIDR: 10.0.3.0/24
  ClusterConfigurations:
    redshift:
      userName: awsuser
      dbName: dev

Parameters:
  DataBucketPrefix:
      Type: String
      Default: "otfs-workshop-data-"
      Description: "DataBucket Prefix for the workshop"

  EMRStudioStorageBucketPrefix:
      Type: String
      Default: "otfs-workshop-studiostorage-"
      Description: "EMR Studio Storage Bucket Prefix for the workshop"

Resources:

  # S3 Bucket for storing our Studio notebooks
  EmrStudioStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join [ '', [!Ref EMRStudioStorageBucketPrefix, !Ref 'AWS::AccountId']]

  # S3 Bucket for storing data 
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join [ '', [!Ref DataBucketPrefix, !Ref 'AWS::AccountId']]

  # IAM resources
  # We create our own EMR Cluster service role utilizing EMR v2 policies

  # EMR Studio requires a service role for saving notebooks to S3
  EMRStudioServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - elasticmapreduce.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Description: "Service role for EMR Studio"
      RoleName: "otfs-workshop-EMRStudio_Service_Role"

  EMRStudioServiceRolePolicy:
    DependsOn:
      - EMRStudioServiceRole
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      Roles:
        - Ref: "EMRStudioServiceRole"
      ManagedPolicyName: "otfs-workshop-EMRStudio_ServiceRolePolicy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3StudioStorageObjectActions
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource:
              - !Sub "arn:aws:s3:::${EmrStudioStorageBucket}/*"

          - Sid: AllowS3StudioStorageBucketActions
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetEncryptionConfiguration
            Resource:
              - !Sub "arn:aws:s3:::${EmrStudioStorageBucket}"

  # EMR Serverless requires a runtime role to execute code
  EMRRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - emr-serverless.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Description: "Service role for EMR Studio"
      RoleName: "otfs-workshop-AmazonEMRStudio_RuntimeRole"

 # EMR Serverless used runtime role needs full s3 permissions on the data bucket and on glue
  EMRRuntimeRolePolicy:
    DependsOn:
      - EMRRuntimeRole
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      Roles:
        - Ref: "EMRRuntimeRole"
      ManagedPolicyName: "otfs-workshop-EMRStudio_RuntimeRolePolicy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3AccessOnDataBucket
            Effect: Allow
            Action:
              - s3:*
            Resource:
              - !Sub "arn:aws:s3:::${DataBucket}/*"
              - !Sub "arn:aws:s3:::${DataBucket}"

          - Sid: AllowFullGluePermissions
            Effect: Allow
            Action:
              - glue:*
              - s3:GetEncryptionConfiguration
            Resource:
              - "*"
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !FindInMap 
        - SubnetConfig
        - VPC
        - CIDR
      InstanceTenancy: default
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      Tags:
        - Key: Name
          Value: Workshop-VPC
        - Key: for-use-with-iceberg-redshift-workshop
          Value: 'true'
  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: IG
  VPCGatewayAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet1:
    Type: 'AWS::EC2::Subnet'
    Properties:
      CidrBlock: !FindInMap 
        - SubnetConfig
        - Public1
        - CIDR
      MapPublicIpOnLaunch: 'true'
      AvailabilityZone: !Select 
        - 0
        - !GetAZs 
          Ref: 'AWS::Region'
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PublicSubnet1
        - Key: for-use-with-iceberg-redshift-workshop
          Value: 'true'
  PublicSubnet2:
    Type: 'AWS::EC2::Subnet'
    Properties:
      CidrBlock: !FindInMap 
        - SubnetConfig
        - Public2
        - CIDR
      MapPublicIpOnLaunch: 'true'
      AvailabilityZone: !Select 
        - 1
        - !GetAZs 
          Ref: 'AWS::Region'
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PublicSubnet2
        - Key: for-use-with-iceberg-redshift-workshop
          Value: 'true'
  PublicSubnet3:
    Type: 'AWS::EC2::Subnet'
    Properties:
      CidrBlock: !FindInMap 
        - SubnetConfig
        - Public3
        - CIDR
      MapPublicIpOnLaunch: 'true'
      AvailabilityZone: !Select 
        - 2
        - !GetAZs 
          Ref: 'AWS::Region'
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PublicSubnet3
        - Key: for-use-with-iceberg-redshift-workshop
          Value: 'true'

  NATGateway1EIP:
    Type: 'AWS::EC2::EIP'
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
  NATGateway2EIP:
    Type: 'AWS::EC2::EIP'
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
  NATGateway3EIP:
    Type: 'AWS::EC2::EIP'
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
  NATGateway1:
    Type: 'AWS::EC2::NatGateway'
    Properties:
      SubnetId: !Ref PublicSubnet1
      AllocationId: !GetAtt 
        - NATGateway1EIP
        - AllocationId
      Tags:
        - Key: Name
          Value: NAT-Gateway1
  NATGateway2:
    Type: 'AWS::EC2::NatGateway'
    Properties:
      SubnetId: !Ref PublicSubnet2
      AllocationId: !GetAtt 
        - NATGateway2EIP
        - AllocationId
      Tags:
        - Key: Name
          Value: NAT-Gateway2
  NATGateway3:
    Type: 'AWS::EC2::NatGateway'
    Properties:
      SubnetId: !Ref PublicSubnet3
      AllocationId: !GetAtt 
        - NATGateway3EIP
        - AllocationId
      Tags:
        - Key: Name
          Value: NAT-Gateway3
  PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PublicRouteTable
  DefaultPublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn: VPCGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      RouteTableId: !Ref PublicRouteTable
      GatewayId: !Ref InternetGateway
  PublicSubnet1RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1
  PublicSubnet2RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2
  PublicSubnet3RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet3
  S3Endpoint:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: '*'
            Principal: '*'
            Resource: '*'
      RouteTableIds:
        - !Ref PublicRouteTable
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref VPC

  VPCEndpointGlue:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.glue'
      VpcId: !Ref VPC

  VPCEndpointRedshift:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.redshift'
      VpcId: !Ref VPC

  VPCEndpointCloudwatch:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.monitoring'
      VpcId: !Ref VPC

  VPCEndpointSecretManager:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcId: !Ref VPC

  VPCDefaultSecurityGroupIngress:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: !GetAtt 
        - VPC
        - DefaultSecurityGroup
      IpProtocol: '-1'
      CidrIp: !FindInMap 
        - SubnetConfig
        - VPC
        - CIDR

  RedShiftSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Security group for Redshift cluster'
      VpcId: !Ref VPC
  RedshiftSGIngressSelfAllTcp:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: !Ref RedShiftSG
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref RedShiftSG
  
  RedshiftIngress:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: !Ref RedShiftSG
      IpProtocol: tcp
      FromPort: 5439
      ToPort: 5439
      CidrIp: 0.0.0.0/0      

  RedshiftSGIngressSelfAllUdp:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: !Ref RedShiftSG
      IpProtocol: udp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref RedShiftSG
  RedshiftSubnetGroup:
    Type: 'AWS::Redshift::ClusterSubnetGroup'
    Properties:
      Description: 'Redshift cluster subnet group'
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
  RedshiftClusterParameterGroup:
    Type: 'AWS::Redshift::ClusterParameterGroup'
    Properties:
      Description: !Join [ " ", [ !Ref 'AWS::StackName', " - Redshift Cluster Parameter group" ]] 
      ParameterGroupFamily: redshift-1.0
  RedshiftCreds:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: 'RedshiftCreds'
      Description: !Sub Redshift cluster master user credentials for ${AWS::StackName}
      GenerateSecretString:
        SecretStringTemplate: !Join [ '', [ '{"username": "', !FindInMap [ ClusterConfigurations, redshift, userName ], '"}' ]]
        GenerateStringKey: 'password'
        PasswordLength: 16
        ExcludePunctuation: true
      Tags:
        -
          Key: RedshiftIcebergworkshopCred
          Value: 'true'

  CMKeyRedshiftCluster:
    Type: AWS::KMS::Key
    Properties:
      Description: 'Customer managed key to be used for encryption at rest'
      Enabled: Yes
      EnableKeyRotation: Yes
      KeyPolicy:
        Version: 2012-10-17
        Id: key-default-1
        Statement:
          - Sid: Enable KMS Permissions for root account user
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: 'Allow access through Redshift for all principals in the account that are authorized to use Redshift'
            Effect: 'Allow'
            Principal:
              AWS: '*'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
              - 'kms:ListGrants'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              StringEquals:
                'kms:CallerAccount': !Sub '${AWS::AccountId}'
                'kms:ViaService': !Sub 'redshift.${AWS::Region}.amazonaws.com'
                
  RedshiftServerlessNamespace:
    Type: 'AWS::RedshiftServerless::Namespace'
    DependsOn:
      - RedshiftCreds
    Properties:
      AdminUsername: !Join [ '', [ '{{resolve:secretsmanager:', !Ref RedshiftCreds, ':SecretString:username}}' ]]
      AdminUserPassword: !Join [ '', [ '{{resolve:secretsmanager:', !Ref RedshiftCreds, ':SecretString:password}}' ]]
      DbName: !FindInMap [ ClusterConfigurations, redshift, dbName ]
      NamespaceName:  !Sub
          - 'namespace-${RandomGUID}'
          - { RandomGUID: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId ]]]] }
      IamRoles:
        - !GetAtt 'MyRedshiftIAMRole.Arn'
      KmsKeyId: !Ref CMKeyRedshiftCluster
      DefaultIamRoleArn: !GetAtt 'MyRedshiftIAMRole.Arn'

  RedshiftServerlessWorkgroup:
    Type: 'AWS::RedshiftServerless::Workgroup'
    DependsOn:
      - RedshiftCreds
      - RedshiftServerlessNamespace
    Properties:
      WorkgroupName: !Sub
          - 'workgroup-${RandomGUID}'
          - { RandomGUID: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId ]]]] }
      NamespaceName:  !Sub
          - 'namespace-${RandomGUID}'
          - { RandomGUID: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId ]]]] }
      BaseCapacity: 32
      PubliclyAccessible: false
      SubnetIds:
        - Ref: PublicSubnet1
        - Ref: PublicSubnet2
        - Ref: PublicSubnet3
      SecurityGroupIds:
        - Ref: RedShiftSG

  MyRedshiftIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Join [ "-", [!Ref 'AWS::StackName', "Redshift-IAM-Role"] ]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'redshift.amazonaws.com'
                - 'glue.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      Path: '/'
      Policies:
        - PolicyName: !Join [ "-", [!Ref 'AWS::StackName', "Spectrum-Glue-Access-Policy"] ]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource:
                  - !Join [
                      '',
                      ['arn:aws:s3:::', !Ref DataBucketPrefix, !Ref 'AWS::AccountId'],
                    ]
                  - !Join [
                      '',
                      ['arn:aws:s3:::', !Ref DataBucketPrefix, !Ref 'AWS::AccountId', '/*'],
                    ]
              - Effect: Allow
                Action:
                  - glue:CreateDatabase
                  - glue:DeleteDatabase
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:UpdateDatabase
                  - glue:CreateTable
                  - glue:DeleteTable
                  - glue:BatchDeleteTable
                  - glue:UpdateTable
                  - glue:GetTable
                  - glue:GetTables
                  - glue:BatchCreatePartition
                  - glue:CreatePartition
                  - glue:DeletePartition
                  - glue:BatchDeletePartition
                  - glue:UpdatePartition
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                  - logs:*
                Resource:
                  - '*'

  GlueIAMRole:
        Type: "AWS::IAM::Role"
        Properties:
            Path: "/"
            RoleName: !Join ['-', ['Glue', 'WorkshopRole']]
            AssumeRolePolicyDocument: "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"glue.amazonaws.com\",\"lambda.amazonaws.com\"]},\"Action\":\"sts:AssumeRole\"}]}"
            MaxSessionDuration: 3600
            ManagedPolicyArns: 
              - "arn:aws:iam::aws:policy/service-role/AWSGlueServiceNotebookRole"
              - "arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole"
              - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
            Description: "Allows Glue to call AWS services on your behalf."

  GlueS3BucketAccessPolicy:
        Type: "AWS::IAM::Policy"
        Properties:
            PolicyDocument: !Sub |
                {
                    "Version": "2012-10-17",
                    "Statement": [
                        {
                            "Sid": "VisualEditor1",
                            "Effect": "Allow",
                            "Action": "s3:*",
                            "Resource": ["arn:aws:s3:::${DataBucket}","arn:aws:s3:::${DataBucket}/*","arn:aws:s3:::aws-glue-assets-${AWS::AccountId}-${AWS::Region}","arn:aws:s3:::aws-glue-assets-${AWS::AccountId}-${AWS::Region}/*"]
                        }
                    ]
                }
            Roles: 
              - !Ref GlueIAMRole
            PolicyName: !Join ['_', ['glue_s3_policy', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]

  
  GlueKinesisAccessPolicy:
        Type: "AWS::IAM::Policy"
        Properties:
            PolicyDocument: !Sub |
                {
                    "Version": "2012-10-17",
                    "Statement": [
                        {
                            "Sid": "VisualEditor0",
                            "Effect": "Allow",
                            "Action": [
                                "kinesis:SubscribeToShard",
                                "kinesis:PutRecords",
                                "kinesis:DescribeStreamConsumer",
                                "kinesis:GetShardIterator",
                                "kinesis:DescribeStream",
                                "kinesis:RegisterStreamConsumer",
                                "kinesis:PutRecord",
                                "kinesis:GetRecords",
                                "kinesis:ListStreamConsumers",
                                "kinesis:ListStreams",
                                "kinesis:ListShards"
                            ],
                            "Resource": ["arn:aws:kinesis:${AWS::Region}:${AWS::AccountId}:stream/${FLKinesisIcebergStream}"]
                        }
                    ]
                }
            Roles: 
              - !Ref GlueIAMRole
            PolicyName: !Join ['_', ['glue_kinesis_policy', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
  
  
  GluePublicS3BucketAccessPolicy:
        Type: "AWS::IAM::Policy"
        Properties:
            PolicyDocument: !Sub |
                {
                    "Version": "2012-10-17",
                    "Statement": [
                        {
                            "Sid": "VisualEditor0",
                            "Effect": "Allow",
                            "Action": ["s3:GetObject","s3:ListBucket"],
                            "Resource": "arn:aws:s3:::redshift-downloads/TPC-DS/100GB/*/*"
                        }
                    ]
                }
            Roles: 
              - !Ref GlueIAMRole
            PolicyName: !Join ['_', ['glue_public_s3_policy', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]


  GlueRoleAthenaAccessPolicy:
        Type: "AWS::IAM::Policy"
        Properties:
            PolicyDocument: !Sub |
                {
                    "Version": "2012-10-17",
                    "Statement": [
                        {
                            "Sid": "VisualEditor1",
                            "Effect": "Allow",
                            "Action": ["athena:StartQueryExecution","athena:StopQueryExecution","athena:GetQueryExecution","athena:GetQueryResults","athena:GetQueryExecutions","athena:RunQuery","athena:ListQueryExecutions","athena:ListNamedQueries","athena:BatchGetNamedQuery"],
                            "Resource": ["arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary"]
                        }
                    ]
                }
            Roles: 
              - !Ref GlueIAMRole
            PolicyName: !Join ['_', ['gluerole_athena_policy', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]

  GlueIAMPassAccessPolicy:
        Type: "AWS::IAM::Policy"
        Properties:
            PolicyDocument: !Sub |
                {
                    "Version": "2012-10-17",
                    "Statement": [
                        {
                            "Effect": "Allow",
                            "Action": "iam:PassRole",
                            "Resource": "arn:aws:iam::${AWS::AccountId}:role/${GlueIAMRole}"
                        }
                    ]
                }
                  
            Roles: 
              - !Ref GlueIAMRole
            PolicyName: !Join ['_', ['glue_iam_pass_policy', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: tpcds

  GlueTableWebSales:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: web_sales
        TableType: EXTERNAL_TABLE
        Parameters: {"classification": "csv"}
        StorageDescriptor:
          Columns:
          - Name: ws_sold_date_sk
            Type: int
          - Name: ws_sold_time_sk
            Type: int
          - Name: ws_ship_date_sk
            Type: int
          - Name: ws_item_sk
            Type: int
          - Name: ws_bill_customer_sk
            Type: int
          - Name: ws_bill_cdemo_sk
            Type: int
          - Name: ws_bill_hdemo_sk
            Type: int
          - Name: ws_bill_addr_sk
            Type: int
          - Name: ws_ship_customer_sk
            Type: int
          - Name: ws_ship_cdemo_sk
            Type: int
          - Name: ws_ship_hdemo_sk
            Type: int
          - Name: ws_ship_addr_sk
            Type: int
          - Name: ws_web_page_sk
            Type: int
          - Name: ws_web_site_sk
            Type: int
          - Name: ws_ship_mode_sk
            Type: int
          - Name: ws_warehouse_sk
            Type: int
          - Name: ws_promo_sk
            Type: int
          - Name: ws_order_number
            Type: int
          - Name: ws_quantity
            Type: int
          - Name: ws_wholesale_cost
            Type: double
          - Name: ws_list_price
            Type: double
          - Name: ws_sales_price
            Type: double
          - Name: ws_ext_discount_amt
            Type: double
          - Name: ws_ext_sales_price
            Type: double
          - Name: ws_ext_wholesale_cost
            Type: double
          - Name: ws_ext_list_price
            Type: double
          - Name: ws_ext_tax
            Type: double

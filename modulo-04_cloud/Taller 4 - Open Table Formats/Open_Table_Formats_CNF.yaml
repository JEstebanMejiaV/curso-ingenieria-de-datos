  AthenaNamedQuery:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: "tpcds"
      Description: "Query to create the prepared_web_sales table"
      Name: "prepared_web_sales"
      QueryString:
        Fn::Sub: |
          CREATE TABLE tpcds.prepared_web_sales
          WITH (
                external_location = 's3://${DataBucket}/datasets/TPC-DS-100-GB/prepared_web_sales/',
                format = 'PARQUET')
          AS SELECT * FROM (
          WITH t1 AS (
          SELECT ws_sold_date_sk, ws_sold_time_sk, ws_order_number, ws_item_sk, ws_quantity, ws_sales_price, ws_warehouse_sk FROM tpcds.web_sales WHERE ws_warehouse_sk IS NOT NULL AND ws_sold_time_sk IS NOT NULL AND ws_sold_date_sk IS NOT NULL AND ws_order_number IS NOT NULL AND ws_item_sk IS NOT NULL
          ),

          t2 AS (
          SELECT CAST(d_year AS varchar) AS d_year, CAST(d_moy AS VARCHAR) AS d_moy, CAST(d_dom AS varchar) AS d_dom, d_date_sk FROM tpcds.date_dim WHERE d_year IS NOT NULL AND d_moy IS NOT NULL AND d_dom IS NOT NULL
          ),

          t3 AS (
          SELECT CAST(t_hour AS varchar) AS t_hour, CAST(t_minute AS varchar) AS t_minute, CAST(t_second AS varchar) AS t_second, t_time_sk FROM tpcds.time_dim WHERE t_hour IS NOT NULL AND t_minute IS NOT NULL AND t_second IS NOT NULL
          ),

          t4 AS (
          SELECT t1.ws_order_number AS ws_order_number, t1.ws_item_sk AS ws_item_sk, t1.ws_quantity AS ws_quantity, t1.ws_sales_price AS ws_sales_price, t1.ws_warehouse_sk AS ws_warehouse_sk, t2.d_year AS d_year, t2.d_moy as d_moy, t2.d_dom as d_dom, t1.ws_sold_time_sk AS ws_sold_time_sk
          FROM t1 JOIN t2
          ON t1.ws_sold_date_sk = t2.d_date_sk
          ),

          t5 AS (
          SELECT t4.ws_order_number AS ws_order_number, t4.ws_item_sk AS ws_item_sk, t4.ws_quantity AS ws_quantity, t4.ws_sales_price AS ws_sales_price, t4.ws_warehouse_sk AS ws_warehouse_sk, CAST("d_year" || '-' || "d_moy" || '-' || "d_dom" || ' ' || "t_hour" || ':' || "t_minute" || ':' || "t_second" AS timestamp) AS ws_sales_time
          FROM t4 JOIN t3
          ON t4.ws_sold_time_sk = t3.t_time_sk
          )

          SELECT * FROM t5)

  LambdaLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: "/aws/lambda/otf_in_a_box_prereq_deploy_lambda"
      RetentionInDays: 90
  
  AthenaQueryTriggerLambdaFunction:
    Type: "AWS::Lambda::Function"
    DependsOn: 
      - GlueIAMRole
      - DataBucket
      - AthenaNamedQuery
      - LambdaLogGroup
    Properties:
        Description: "Lambda function to trigger athena named query"
        FunctionName: "otf_in_a_box_prereq_deploy_lambda"
        Handler: "otf_in_a_box_prereq_deploy_function.lambda_handler"
        Architectures: 
          - "x86_64"
        Code: 
            S3Bucket: aws-data-analytics-workshops
            S3Key: transactional-and-mutable-datalakes/scripts/otf_in_a_box_prereq_deploy_lambda.zip 
        MemorySize: '128'
        Role: !GetAtt GlueIAMRole.Arn
        Environment:
            Variables:
                s3_bucket: !Ref DataBucket
                named_query: "prepared_web_sales"
                s3_bucket_2: !Ref EmrStudioStorageBucket
                db_name: "tpcds"
                glue_job_role: !GetAtt GlueIAMRole.Arn
                stream_arn: !GetAtt FLKinesisIcebergStream.Arn
        Runtime: python3.12
        Timeout: '300'
        EphemeralStorage: 
            Size: 512
  EnablePrereqLambda:
    Type: Custom::EnableLambda
    Version: '1.0'
    Properties:
        ServiceToken: !GetAtt AthenaQueryTriggerLambdaFunction.Arn
  
  FLVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 100.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  FLPublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FLVPC
      CidrBlock: 100.0.0.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: us-east-1a
  FLPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FLVPC
      CidrBlock: 100.0.1.0/24
  FLInternetGateway:
    Type: AWS::EC2::InternetGateway
  FLAttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FLVPC
      InternetGatewayId: !Ref FLInternetGateway
  FLEMRServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticmapreduce.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonElasticMapReduceRole
  FLEMRJobFlowRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonElasticMapReduceforEC2Role
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
        - arn:aws:iam::aws:policy/AmazonKinesisFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonSSMManagedEC2InstanceDefaultPolicy
  FLEMRInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: emr-instance-profile-flink-iceberg
      Roles:
        - !Ref FLEMRJobFlowRole
  FLPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FLVPC
  FLPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FLPublicSubnet1
      RouteTableId: !Ref FLPublicRouteTable
  FLDefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - FLAttachGateway
      - FLPublicSubnet1RouteTableAssociation
    Properties:
      RouteTableId: !Ref FLPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref FLInternetGateway
  FLEMRIcebergCluster:
    Type: AWS::EMR::Cluster
    DependsOn:
      - FLEMRInstanceProfile
      - FLPublicSubnet1
      - FLPrivateSubnet
      - FLEMRJobFlowRole
      - FLDefaultPublicRoute
    Properties:
      JobFlowRole: !Ref FLEMRInstanceProfile
      Name: emr-iceberg-cdk
      ServiceRole: !Ref FLEMRServiceRole
      ReleaseLabel: emr-7.0.0
      Instances:
        CoreInstanceGroup:
          InstanceCount: 1
          InstanceType: m5.xlarge
        MasterInstanceGroup:
          InstanceCount: 1
          InstanceType: m5.xlarge
        Ec2SubnetId: !Ref FLPublicSubnet1
      Applications:
        - Name: Flink
        - Name: Zeppelin
        - Name: Hive
        - Name: Hadoop
  FLKinesisIcebergStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: kinesis-source
      RetentionPeriodHours: 24
      StreamModeDetails:
        StreamMode: ON_DEMAND
  FLMyGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Sub ${AWS::AccountId}
      DatabaseInput:
        Name: iceberg_flink
  FLEMRIcebergStep:
    Type: AWS::EMR::Step
    DependsOn:
      - FLEMRIcebergCluster
    Properties:
      Name: EMRIcebergStep
      ActionOnFailure: CONTINUE
      HadoopJarStep:
        Jar: command-runner.jar
        Args:
          - bash
          - '-c'
          - !Join
            - ''
            - - 'cd /usr/lib/flink/lib && '
              - 'sudo wget https://repo1.maven.org/maven2/software/amazon/awssdk/bundle/2.21.5/bundle-2.21.5.jar && '
              - 'sudo wget https://repo1.maven.org/maven2/com/github/ben-manes/caffeine/caffeine/2.9.3/caffeine-2.9.3.jar && '
              - 'sudo wget https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-aws/1.5.0/iceberg-aws-1.5.0.jar && '
              - 'sudo wget https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-flink-runtime-1.18/1.5.0/iceberg-flink-runtime-1.18-1.5.0.jar && '
              - 'sudo wget https://repo1.maven.org/maven2/org/apache/orc/orc-core/1.9.1/orc-core-1.9.1.jar && '
              - sudo wget https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kinesis/4.2.0-1.18/flink-sql-connector-kinesis-4.2.0-1.18.jar &&
              - 'sudo chmod 755 bundle-2.21.5.jar && '
              - 'sudo chmod 755 caffeine-2.9.3.jar && '
              - 'sudo chmod 755 iceberg-aws-1.5.0.jar && '
              - 'sudo chmod 755 iceberg-flink-runtime-1.18-1.5.0.jar && '
              - 'sudo chmod 755 flink-sql-connector-kinesis-4.2.0-1.18.jar && '
              - 'sudo chmod 755 bundle-2.21.5.jar && '
              - sudo chmod 755 orc-core-1.9.1.jar
      JobFlowId: !Ref FLEMRIcebergCluster